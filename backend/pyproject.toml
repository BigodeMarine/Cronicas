[project]
name = "forgehub"
version = "0.1.0"
description = "API para gerenciamento de projetos e tarefas"
authors = [
    {name = "Edson",email = "cryrider8@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "pydantic[email] (>=2.13.5,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
